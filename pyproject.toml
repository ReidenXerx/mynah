[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mynah"
version = "0.1.0"
description = "Say it, and it types where you are. Local, private voice dictation for Linux and macOS."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DuduPhudu" }]
keywords = ["dictation", "speech-to-text", "voice", "whisper", "wayland", "macos", "local-first"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The core carries no dependency at all: settings, the segmentation contract and
# the provider registry are stdlib. What listens and what types comes from the
# platform extra, so `mynah --help` and `mynah config` work on a bare install.
dependencies = []

[project.optional-dependencies]
macos = [
  "mlx-whisper>=0.1",
  "sounddevice>=0.4",
  "webrtcvad>=2.0",
  "pynput>=1.7",
  "pyobjc-framework-Cocoa>=10",
  "pyobjc-framework-Quartz>=10",
  "pyobjc-framework-ApplicationServices>=10",
  "rumps>=0.4",
  "setproctitle>=1.3",
]
test = ["pytest>=7"]

[project.scripts]
mynah = "mynah.cli:main"

[project.urls]
Homepage = "https://duduphudu.app/mynah/"
Source = "https://github.com/ReidenXerx/mynah"
Issues = "https://github.com/ReidenXerx/mynah/issues"

[tool.setuptools.packages.find]
include = ["mynah*"]

[tool.setuptools.package-data]
mynah = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
